<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Sponsor Eccles Agent: built on a Chromebook, powered by stubbornness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b0b2e"/><stop offset="0.6" stop-color="#3a0f4a"/><stop offset="1" stop-color="#5a1646"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#ff8a4c"/></linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5fa2" stop-opacity="0.45"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="190" r="260" fill="url(#g)"/>
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="80" y="104" font-size="30" font-weight="600" fill="#ffb3d1">&#10084;  SPONSOR THE BUILD</text>
    <text x="80" y="176" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Built on a Chromebook.</text>
    <text x="80" y="244" font-size="62" font-weight="800" fill="#ffd1e3" letter-spacing="-1">Powered by stubbornness.</text>
    <text x="80" y="296" font-size="26" fill="#e6d3ee">One developer, no Play Store account, zero budget. Your support is the upgrade.</text>
  </g>
  <g transform="translate(880 120)">
    <rect width="320" height="96" rx="48" fill="url(#btn)"/>
    <text x="160" y="62" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#2a0a1a">&#10084;  Support</text>
  </g>
  <text x="1040" y="260" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#f3dcea">Help build it. Every bit counts.</text>
</svg>
